[pytest]
markers =
    db: nécessite un PostgreSQL joignable avec le schéma llm_souverain
addopts = -ra --strict-markers

# Sans cette ligne, pytest refuse les tests asynchrones :
# « async def functions are not natively supported ».
asyncio_mode = auto

# Une seule boucle d'événements pour toute la session : le pool de
# connexions y est rattaché, un scope par test le rendrait inutilisable
# dès le deuxième.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# testpaths volontairement absent : pytest cherche depuis la racine, que
# les tests soient à plat ou dans tests/.